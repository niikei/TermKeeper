[project]
name = "termkeeper"
version = "0.3.0"
description = "Don't lose unknown terms."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18,<2",
    "sqlmodel>=0.0.39,<0.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.139,<0.140",
    "uvicorn>=0.51,<1",
]
mcp = [
    "mcp>=1.27,<2",
]
dev = [
    "fastapi>=0.139,<0.140",
    "httpx2>=2.7,<3",
    "mcp>=1.27,<2",
    "mypy>=1.14",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.6",
]

[project.scripts]
tk = "termkeeper.presentation.cli.main:main"
tk-api = "termkeeper.adapters.http.app:main"
tk-mcp = "termkeeper.adapters.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=termkeeper --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["*/infrastructure/migrations/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Use the D211/D212 docstring convention; their counterparts are mutually exclusive.
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Assertions, descriptive test names, and literal expected values are idiomatic in pytest.
"tests/**" = ["D100", "D103", "D104", "EM101", "PLR2004", "S101", "TRY003"]
